<!DOCTYPE html>
<html>
<head>
    <title>CMSC434</title>
    <link rel="stylesheet" href="style.css">
    <style>
        nav svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            stroke-width: 0.5;
        }
        
        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: var(--primary);
            padding: 10px;
            border-radius: 20px;
            margin: 10px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
        }

        nav button {
            background: transparent;
            color: var(--secondary);
            box-shadow: none;
            padding: 10px 8px;
            font-size: 10px;
            border-radius: 15px;
            flex: 1;
        }

        nav button.active {
            background-color: var(--highlight);
            color: var(--bg);
        }

        nav button:hover {
            background-color: var(--secondary);
            color: var(--bg);
        }

        nav button.active:hover {
            background-color: var(--highlight);
        }
    </style>
    <meta charset="UTF-8">
</head>

<body>
    <div class="app">

        <iframe id="content" src="recipes.html"></iframe> <!-- change this back to inventory.html later -->

        <nav>
            <button class = "active" onclick="openTab('inventory.html', this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
  <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
</svg></button>
            <button onclick="openTab('shopping-list.html', this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
  <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
</svg></button>
            <button onclick = "openTab('add-item.html', this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-square" viewBox="0 0 16 16">
  <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
  <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
</svg></button>
            <button onclick = "openTab('recipes.html', this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-book" viewBox="0 0 16 16">
  <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/>

            <button onclick = "openTab('profile.html', this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
  <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
</svg></button>
        </nav>

    </div>

    <script>
        function openTab(filename, button) {
            // displays ts page
            document.getElementById("content").src = filename;

            //  inactive butt
            document.querySelectorAll("nav button").forEach(function(btn) {
                btn.classList.remove("active");
            });

            // activates the active button hopefully highlights in the nav bar
            button.classList.add("active");
        }
        window.addEventListener("message", function(event) {
    if (event.data.page === "add-item.html") {
        const button = document.querySelector("nav button:nth-child(3)");
        const iframe = document.getElementById("content");

        iframe.onload = function() {
            iframe.contentWindow.postMessage({
                name: event.data.name
            }, "*");
            iframe.onload = null;
        };

        openTab("add-item.html", button);
    }
});
    </script>
</body>
</html>
