<!DOCTYPE html>
<html>
<head>
    <title>CMSC434</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
</head>

<body>
    <div class="app">

        <iframe id="content" src="inventory.html"></iframe>

        <nav>
            <button class = "active" onclick="openTab('inventory.html', this)">🎒 Inventory</button>
            <button onclick="openTab('shopping-list.html', this)">$ Shopping List</button>
            <button onclick = "openTab('add-item.html', this)">+ Add Item </button>
            <button onclick = "openTab('recipes.html', this)">Recipes</button>
            <button onclick = "openTab('profile.html', this)">👤 Profile</button>
        </nav>

    </div>

    <script>
        function openTab(filename, button) {
            // displays ts page
            document.getElementById("content").src = filename;

            //  inactive butt
            document.querySelectorAll("nav button").forEach(function(btn) {
                btn.classList.remove("active");
            });

            // activates the active button hopefully highlights in the nav bar
            button.classList.add("active");
        }
    </script>
</body>
</html>
