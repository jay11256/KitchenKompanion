

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List | Kitchen Kompanion</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>

<body>
    <main class="container">
        <h1>Shopping List</h1>
        <p>What do we need to buy?</p>

        <!-- adding-->
        <div class="card">
            <h2>Add an Item</h2>
            <input type="text" id="itemInput"
                   placeholder="e.g. Milk">

                   
            <button onclick="addItem()">Add Item +</button>
        </div>

        <div class="section">
            <div class="receipt">
    <h2>MY SHOPPING LIST</h2>
    <hr>
    <div id="shoppingList"></div>
    <hr>
    <p>READY TO COOK, CHEF! ♡</p>
</div>
        </div>
    </main>

 

    <script>
        function addItem() {
            const input = document.getElementById("itemInput");
            const name = input.value.trim();

            if (name === "") return;

            const list = document.getElementById("shoppingList");

            const item = document.createElement("div");
            item.className = "card";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.style.width = "auto";

            const label = document.createElement("span");
            label.textContent = " " + name + " ";

            checkbox.addEventListener("change", () => {
                label.style.textDecoration =
                    checkbox.checked ? "line-through" : "none";
            });

            const remove = document.createElement("button");
            remove.textContent = "×";
            remove.onclick = () => item.remove();
            remove.style.fontSize = "12px";

            // gonna be able to remove items from shopping list and add them to fridge when the add item page is done
            // IMPLEMENT TSSSSSSSS 
            const fridge = document.createElement("button");
            fridge.textContent = "Add to Fridge";

            fridge.onclick = () => {
            // TODO: Pass item name to add-item.html and prefill name field.
            window.parent.location.href = "add-item.html";
        }  ;

            item.append(checkbox, label, fridge, remove);
            list.appendChild(item);

            input.value = "";
        }

        document.getElementById("itemInput")
            .addEventListener("keydown", (event) => {
                if (event.key === "Enter") addItem();
            });
    </script>
</body>
</html>
