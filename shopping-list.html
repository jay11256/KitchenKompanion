

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List | Kitchen Kompanion</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>

<body>
    <main class="container">
        <h1>Shopping List</h1>
        <p>What do we need to buy?</p>

        <!-- adding-->
        <div class="card">
            <h2>Add an Item</h2>
            <div style="width: 100%;" class="search-bar">
                <div><input type="text" id="itemInput" placeholder="e.g. Milk"></div>
                <div><button onclick="addItem()">Add Item</button></div>
            </div>
        </div>

        <div class="section">
            <div class="receipt">
    <h2>MY SHOPPING LIST</h2>
    <hr>
    <div id="shoppingList"></div>
    <hr>
    <p>READY TO COOK, CHEF! ♡</p>
</div>
        </div>
    </main>

 

<script>
    function addItem(name = "", checked = false) {
        const input = document.getElementById("itemInput");
        name = name || input.value.trim();

        if (name === "") return;

        const list = document.getElementById("shoppingList");
        const item = document.createElement("div");
        item.className = "card";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.style.width = "auto";
        checkbox.checked = checked;

        const label = document.createElement("span");
        label.textContent = " " + name + " ";
        label.style.textDecoration = checked ? "line-through" : "none";

        checkbox.addEventListener("change", () => {
            label.style.textDecoration =
                checkbox.checked ? "line-through" : "none";
            saveList();
        });

        const remove = document.createElement("button");
        remove.textContent = "×";
        remove.style.fontSize = "12px";
        remove.onclick = () => {
            item.remove();
            saveList();
        };

        const fridge = document.createElement("button");
        fridge.textContent = "Add to Fridge";

        fridge.onclick = () => {
            window.parent.postMessage({
                page: "add-item.html",
                name: name
            }, "*");
        };

        item.append(checkbox, label, fridge, remove);
        list.appendChild(item);

        input.value = "";
        saveList();
    }

    // Save shopping list as JSON in the browser
    function saveList() {
        const items = [];

        document.querySelectorAll("#shoppingList .card").forEach(item => {
            items.push({
                name: item.querySelector("span").textContent.trim(),
                checked: item.querySelector("input").checked
            });
        });

        localStorage.setItem("shoppingList", JSON.stringify(items));
    }

    // Restore shopping list when returning to this tab
    function loadList() {
        const items = JSON.parse(localStorage.getItem("shoppingList") || "[]");

        items.forEach(item => {
            addItem(item.name, item.checked);
        });
    }

    document.getElementById("itemInput").addEventListener("keydown", event => {
        if (event.key === "Enter") addItem();
    });

    loadList();
</script>

</body>
</html>
