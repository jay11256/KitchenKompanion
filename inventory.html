
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>

<div class="container"> 

    <div class="welcome">
        <div class="welcome-text">
            <p id="date"></p>
            <h1>hello, <span id="username">chef</span>! ♡</h1>
            <p>what's cooking today? (=^･ω･^=)</p>
        </div>

          <div class="speech-bubble" id="koko-message">
        your kitchen looks purrfect!
    </div>

        <img src="koko_cat.png" alt="Koko the Catgirl" class="koko">
    </div>
    
<!-- overview section -->
    <div class="overview">
        <div class="stat-card">
            <span class="material-symbols-rounded">kitchen</span>
            <h2 id="totalItems">0</h2>
            <p>ingredients</p>
        </div>

        <div class="stat-card">
            <span class="material-symbols-rounded">schedule</span>
            <h2 id="expiringCount">0</h2>
            <p>expiring soon</p>
        </div>

        <div class="stat-card">
            <span class="material-symbols-rounded">shopping_basket</span>
            <h2 id="shoppingCount">0</h2>
            <p>to buy</p>
        </div>
    </div>


<!-- actual list of inventory items -->
    <div class="section pantry">

        <div class="pantry-header">
            <h2>your pantry ♡</h2>

            <select id="sortBy" onchange="sortItems()">
                <option value="expiration">Expiring First</option>
                <option value="alphabetical">A to Z</option>
                <option value="recent">Recently Added</option>
            </select>
        </div>

        <div class="search-bar">
            <span class="material-symbols-rounded">search</span>
            <input type="text" id="searchInput" placeholder="search ingredients...">
        </div>

        <div class="food-filters">
            <button class="selected" onclick="filterGroup('All', this)">All</button>
            <button onclick="filterGroup('Dairy', this)">Dairy</button>
            <button onclick="filterGroup('Fruit', this)">Fruit</button>
            <button onclick="filterGroup('Vegetable', this)">Vegetable</button>
            <button onclick="filterGroup('Meat', this)">Meat</button>
            <button onclick="filterGroup('Poultry', this)">Poultry</button>
            <button onclick="filterGroup('Grain', this)">Grain</button>
            <button onclick="filterGroup('Frozen', this)">Frozen</button>
            <button onclick="filterGroup('Condiment', this)">Condiment</button>
            <button onclick="filterGroup('Other', this)">Other</button>
        </div>

        <div id="inventoryList"></div>

    </div>

    <!-- Ingredient Details Popup -->
    <div id="itemPopup" class="popup" onclick="closePopup()">
        <div class="popup-content" onclick="event.stopPropagation()">
            <button class="popup-close" onclick="closePopup()">×</button>

            <div id="popupIcon"></div>
            <h2 id="popupName"></h2>
            <p id="popupGroup"></p>

            <hr>

            <div class="detail-row">
                <span>quantity</span>
                <span id="popupQuantity"></span>
            </div>

            <div class="detail-row">
                <span>purchased</span>
                <span id="popupPurchase"></span>
            </div>

            <div class="detail-row">
                <span>expires</span>
                <span id="popupExpiration"></span>
            </div>

            <div class="detail-row">
                <span>ownership</span>
                <span id="popupOwner"></span>
            </div>

            <button onclick="closePopup()">done ♡</button>
        </div>
    </div>


</div> <!-- closes container -->


<script>
    //  today's date idt ts needs wifi but check
    document.getElementById("date").textContent =
        new Date().toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric"
        });

    // TODO: Replace with the username saved from Profile
    document.getElementById("username").textContent = "chef";
    
    const items = JSON.parse(localStorage.getItem("items") || "[]");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const expiring = items.filter(item => {
        if (!item.expiration) return false;
        const days = Math.ceil(
            (new Date(item.expiration + "T00:00") - today) / 86400000
        );
        return days >= 0 && days <= 3;
    });

    let message = "your kitchen looks purrfect, nya~!";

    if (items.length === 0) {
        message = "your fridge is looking lonely (ﾐ･｡･ﾐ) add some groceries!";
    } else if (expiring.length > 0) {
        message = expiring.length + " item(s) expiring soon! let's cook, nya~!";
    }

    document.getElementById("koko-message").textContent = message;

    // coutn inventory items like stuff thats added alr
    const inventoryItems = JSON.parse(localStorage.getItem("items") || "[]");

    document.getElementById("totalItems").textContent = inventoryItems.length;

    // couunt ingredients expiring within 3 days
    const todayDate = new Date();
    todayDate.setHours(0, 0, 0, 0);

    const expiringItems = inventoryItems.filter(item => {
        if (!item.expiration) return false;

        const expiration = new Date(item.expiration + "T00:00");
        const days = Math.round((expiration - todayDate) / 86400000);

        return days >= 0 && days <= 3;
    });

    document.getElementById("expiringCount").textContent = expiringItems.length;

    // count all the shopping list items even if theyre checked bc theyre not acc added yet
    const shoppingItems = JSON.parse(localStorage.getItem("shoppingList") || "[]");

    document.getElementById("shoppingCount").textContent =
        shoppingItems.length;


    //  icons based on food group! we can totes change this for more specific later
    const foodIcons = {
        Dairy: "🥛",
        Fruit: "🍓",
        Poultry: "🍗",
        Meat: "🥩",
        Grain: "🍞",
        Vegetable: "🥕",
        Condiment: "🧂",
        Frozen: "🧊",
        Other: "🍽️"
    };

    const inventoryList = document.getElementById("inventoryList");
    inventoryList.className = "inventory-list";

    // puts items in list w expirey warnings
    inventoryItems.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "inventory-row";
        row.dataset.expiration = item.expiration || "9999";
        row.dataset.index = index;
        row.dataset.name = item.name.toLowerCase();

        const icon = foodIcons[item.group] || "🍽️";

        let expiryText = "No expiry";
        let urgent = false;

        if (item.expiration) {
            const days = Math.round(
                (new Date(item.expiration + "T00:00") - todayDate) / 86400000
            );

            if (days < 0) {
                expiryText = "Expired";
                urgent = true;
            } else if (days === 0) {
                expiryText = "Today";
                urgent = true;
            } else if (days === 1) {
                expiryText = "Tomorrow";
                urgent = true;
            } else {
                expiryText = days + " days";
                urgent = days <= 3;
            }
        }

        row.innerHTML = `
            <span class="food-icon">${icon}</span>
            <div class="food-info">
                <h3></h3>
                <p></p>
            </div>
            <span class="expiry-tag ${urgent ? "urgent" : ""}">${expiryText}</span>
            <button class="delete-item">×</button>
        `;
        row.querySelector(".delete-item").onclick = () => {
            event.stopPropagation();
            if (confirm("remove " + item.name + " from your pantry?")) {
                const index = inventoryItems.indexOf(item);
                inventoryItems.splice(index, 1);
                localStorage.setItem("items", JSON.stringify(inventoryItems));
                location.reload();
            }
        };

        row.querySelector("h3").textContent = item.name;
        row.dataset.name = item.name.toLowerCase();
        row.dataset.group = item.group;
        row.querySelector("p").textContent = item.quantity + " • " + item.group;
        row.style.cursor = "pointer";
        row.onclick = () => showDetails(item);

        inventoryList.appendChild(row);
    });
    sortItems();

    // empty pantry message
    if (inventoryItems.length === 0) {
        inventoryList.innerHTML = "<p style='padding: 15px;'>no ingredients yet, nya~!</p>";
    }

    // Filter ingredients as the user types
    
    let selectedGroup = "All";

    function applyFilters() {
        const search = document.getElementById("searchInput").value.toLowerCase().trim();

        document.querySelectorAll(".inventory-row").forEach(row => {
            const matchesName = row.dataset.name.includes(search);
            const matchesGroup = selectedGroup === "All" ||
                                row.dataset.group === selectedGroup;

            row.style.display = matchesName && matchesGroup ? "flex" : "none";
        });
    }

    function filterGroup(group, button) {
        selectedGroup = group;

        document.querySelectorAll(".food-filters button").forEach(btn => {
            btn.classList.remove("selected");
        });

        button.classList.add("selected");
        applyFilters();
    }

    document.getElementById("searchInput").addEventListener("input", applyFilters);


    function sortItems() {
        const list = document.getElementById("inventoryList");
        const rows = Array.from(list.querySelectorAll(".inventory-row"));
        const sort = document.getElementById("sortBy").value;

        rows.sort((a, b) => {
            if (sort === "alphabetical") {
                return a.dataset.name.localeCompare(b.dataset.name);
            }

            if (sort === "expiration") {
                return a.dataset.expiration.localeCompare(b.dataset.expiration);
            }

            return Number(b.dataset.index) - Number(a.dataset.index);
        });

        rows.forEach(row => list.appendChild(row));
    }
    
    function showDetails(item) {
        document.getElementById("popupIcon").textContent =
            foodIcons[item.group] || "🍽️";

        document.getElementById("popupName").textContent = item.name;
        document.getElementById("popupGroup").textContent = item.group;
        document.getElementById("popupQuantity").textContent = item.quantity;
        document.getElementById("popupPurchase").textContent = item.purchase || "Not set";
        document.getElementById("popupExpiration").textContent = item.expiration || "Not set";
        document.getElementById("popupOwner").textContent = item.owner || "Not set";

        document.getElementById("itemPopup").style.display = "flex";
    }

    function closePopup() {
        document.getElementById("itemPopup").style.display = "none";
    }




</script>
