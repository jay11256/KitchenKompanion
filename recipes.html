

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes | Kitchen Kompanion</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

    <style>
        #add-recipe button {
            padding: 0;
            width: 100%;
            display: block;
            line-height: 0;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-family: inherit;
            border: 1.5px solid var(--text);
            border-radius: 10px;
            resize: vertical;
        }

        .btn-danger {
            width: 100%;
            margin-top: 16px;
            background-color: var(--highlight);
        }

        .btn-danger:hover {
            background-color: var(--text);
        }

        /* QUANTITY STEPPER (add item + add recipe) */
        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
        }
        .stepper button {
            padding: 12px 14px;
        }
        .stepper select {
            width: auto;
        }

        .ingredient-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .ingredient-row .ing-name {
            flex: 1;
            min-width: 0;
        }

        .ing-qty {
            min-width: 20px;
            text-align: center;
        }

        .ing-remove {
            background: none;
            color: var(--highlight);
            box-shadow: none;
            padding: 8px;
            font-size: 16px;
        }

        .ing-remove:hover {
            background: none;
            color: var(--text);
        }

        .add-ingredient-btn {
            width: 100%;
            margin-bottom: 12px;
        }

        .photo-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 16px;
        }
        .photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            background: var(--primary);
            border: 3px solid var(--primary);
            box-sizing: border-box;
        }
        .photo-btn {
            position: absolute;
            right: -8px;
            bottom: -8px;
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #new-recipe-image {
            display: none;
        }

        #detail-image {
            width: 100%;
            max-height: 240px;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 12px;
        }

        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .detail-header h2 {
            margin: 0;
        }

        .favorite-btn {
            background: transparent;
            box-shadow: none;
            padding: 0;
            color: var(--text);
            flex-shrink: 0;
            display: flex;
        }

        .favorite-btn:hover {
            background: transparent;
            color: var(--highlight);
        }

        .favorite-btn.favorited {
            color: #f0b429;
        }

        .favorite-btn svg {
            width: 22px;
            height: 22px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
        }

        .radio-group input {
            width: auto;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Recipes</h1>

        <div class="search-bar" id="recipes-search">
            <div>
                <label for="recipe-name">Recipe Name</label>
                <input type="text" id="recipe-name" placeholder="Search recipes...">
            </div>
            <div>
                <label for="sort">Sort By</label>
                <select id="sort">
                    <option value="none">None</option>
                    <option value="difficulty">Difficulty</option>
                    <option value="time">Time</option>
                    <option value="availability">Availability</option>
                </select>
            </div>
        </div>

        <div class="recipes-grid" id="recipes-grid">
            <!-- Recipes will be dynamically inserted here -->
            <div class="card recipe-card" id="add-recipe">
                <button onclick="openAddRecipePopup()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                    </svg>
                </button>
                <h2>Add Recipe</h2>
                <h4>Click to add a new recipe</h4>
                <h4></h4>
            </div>
        </div>

        <!-- Popups -->

        <div class="popup-overlay" id="popup-overlay">
            <div class="popup" id="add-recipe-popup">
                <button class="popup-close" onclick="closePopup()" aria-label="Close">✕</button>
                <form id="add-recipe-form">
                    <h2 id="add-recipe-form-title">Add Recipe</h2>

                    <div class="photo-wrap">
                        <img id="new-recipe-image-preview" src="assets/placeholder-recipe-icon.jpg" alt="">
                        <button type="button" class="photo-btn" onclick="document.getElementById('new-recipe-image').click()" aria-label="Change recipe photo">📷</button>
                        <input type="file" id="new-recipe-image" accept="image/*">
                    </div>

                    <label for="new-recipe-name">Recipe Name</label>
                    <input type="text" id="new-recipe-name" required>

                    <label for="new-recipe-difficulty">Difficulty</label>
                    <select id="new-recipe-difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>

                    <label for="new-recipe-time">Time (minutes)</label>
                    <input type="number" id="new-recipe-time" min="1" required>

                    <label>Ingredients</label>
                    <div id="ingredient-rows"></div>
                    <button type="button" class="btn-secondary add-ingredient-btn" onclick="addIngredientRow()">+ Add Ingredient</button>

                    <label for="new-recipe-steps">Steps (one per line)</label>
                    <textarea id="new-recipe-steps" rows="3" required></textarea>
                    
                    <button type="submit" id="add-recipe-submit-btn" style="width: 100%; margin: 10px 0;">Add Recipe</button>
                    <!-- <button type="reset">Clear Form</button> -->
                </form>
            </div>

            <div class="popup" id="recipe-details-popup">
                <button class="popup-close" onclick="closePopup()" aria-label="Close">✕</button>
                <img id="detail-image" src="assets/placeholder-recipe-icon.jpg" alt="">
                <div class="detail-header">
                    <h2 id="detail-name"></h2>
                    <button type="button" id="favorite-btn" class="favorite-btn" aria-label="Favorite recipe"></button>
                </div>
                <p id="detail-difficulty"></p>
                <p id="detail-time"></p>
                <h4>Ingredients</h4>
                <ul id="detail-ingredients"></ul>
                <h4>Steps</h4>
                <ol id="detail-steps"></ol>

                <button type="button" id="open-add-to-shopping-btn" class="btn-secondary" style="width: 100%; margin-top: 16px;">Add to Shopping List</button>
                <button type="button" id="edit-recipe-btn" class="btn-secondary" style="width: 100%; margin-top: 10px;">Edit Recipe</button>
                <button type="button" id="delete-recipe-btn" class="btn-danger">Delete Recipe</button>
            </div>

            <div class="popup" id="add-to-shopping-popup">
                <button class="popup-close" onclick="closePopup()" aria-label="Close">✕</button>
                <h2>Add to Shopping List</h2>

                <label>Ingredients to add</label>
                <div class="radio-group">
                    <label><input type="radio" name="shopping-preset" value="all" checked> All ingredients</label>
                    <label><input type="radio" name="shopping-preset" value="missing"> Missing ingredients only</label>
                </div>

                <label for="shopping-list-select">Shopping list</label>
                <select id="shopping-list-select"></select>

                <button type="button" id="confirm-add-to-shopping-btn" style="width: 100%; margin-top: 16px;">Add to List</button>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
    <script>
        const RECIPES_KEY = "recipes";
        const DIFFICULTY_ORDER = { easy: 0, medium: 1, hard: 2 };
        const UNITS = ["", "tsp", "tbsp", "cup", "fl oz", "oz", "lb", "g", "kg",
               "pt", "qt", "gal", "L", "pack", "can", "bottle", "box", "dozen"];
        const PLACEHOLDER_IMAGE = "assets/placeholder-recipe-icon.jpg";
        let currentRecipeId = null;
        let editingRecipeId = null;
        let currentRecipeImage = null;

        // localStorage stuff
        function loadRecipes() {
            try {
                return JSON.parse(localStorage.getItem(RECIPES_KEY)) || [];
            } catch {
                return [];
            }
        }
        function saveRecipes(recipes) {
            localStorage.setItem(RECIPES_KEY, JSON.stringify(recipes));
        }
        function loadInventory() {
            try {
                return JSON.parse(localStorage.getItem("items")) || [];
            } catch {
                return [];
            }
        }

        // Availability of a single ingredient against the pantry:
        // "green" = enough on hand in a matching unit
        // "yellow" = have it but not enough (or a different unit)
        // "red" = not in the pantry at all
        function ingredientAvailability(ingredient) {
            const name = ingredient.name.trim().toLowerCase();
            const matches = loadInventory().filter(item => (item.name || "").trim().toLowerCase() === name);
            if (matches.length === 0) return "red";

            const sameUnit = matches.filter(item => (item.unit || "") === (ingredient.unit || ""));
            const sameUnitTotal = sameUnit.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);

            if (sameUnit.length > 0 && sameUnitTotal >= (ingredient.quantity || 0)) return "green";
            return "yellow";
        }

        // Share of a recipe's ingredients that are fully available (1 = all green, 0 = all missing)
        function recipeAvailabilityScore(recipe) {
            const ingredients = recipe.ingredients.filter(ing => typeof ing !== "string");
            if (ingredients.length === 0) return 0;

            const scores = { green: 1, yellow: 0.5, red: 0 };
            const total = ingredients.reduce((sum, ing) => sum + scores[ingredientAvailability(ing)], 0);
            return total / ingredients.length;
        }

        const AVAILABILITY_ICONS = { green: "✅", yellow: "🟡", red: "❌" };

        // Overall availability of a recipe: green if every ingredient is on
        // hand, red if none of them are, yellow for anything in between
        function recipeAvailabilityStatus(recipe) {
            const score = recipeAvailabilityScore(recipe);
            if (score === 1) return "green";
            if (score === 0) return "red";
            return "yellow";
        }
        function splitLines(text) {
            return text.split("\n").map(line => line.trim()).filter(line => line !== "");
        }
        function capitalize(word) {
            return word.charAt(0).toUpperCase() + word.slice(1);
        }

        // Add ingredient rows
        function addIngredientRow(ingredient = {}) {
            const row = document.createElement("div");
            row.className = "ingredient-row";
            row.innerHTML = `
                <input type="text" class="ing-name" placeholder="Ingredient" aria-label="Ingredient name">
                <div class="stepper">
                    <button type="button" class="ing-minus" aria-label="Decrease quantity">-</button>
                    <span class="ing-qty"></span>
                    <button type="button" class="ing-plus" aria-label="Increase quantity">+</button>
                    <select class="ing-unit" aria-label="Unit"></select>
                </div>
                <button type="button" class="ing-remove" aria-label="Remove ingredient">✕</button>
            `;

            // unit dropdown
            const select = row.querySelector(".ing-unit");
            UNITS.forEach(unit => {
                const option = document.createElement("option");
                option.value = unit;
                option.textContent = unit || "unit";
                select.appendChild(option);
            });
            select.value = ingredient.unit || "";

            // name
            row.querySelector(".ing-name").value = ingredient.name || "";

            // quantity stepper (same behavior as add-item: whole numbers, minimum 1)
            let qty = ingredient.quantity || 1;
            const qtySpan = row.querySelector(".ing-qty");
            qtySpan.textContent = qty;

            function changeQty(amount) {
                qty = Math.max(1, qty + amount);
                qtySpan.textContent = qty;
            }
            row.querySelector(".ing-minus").addEventListener("click", () => changeQty(-1));
            row.querySelector(".ing-plus").addEventListener("click", () => changeQty(1));

            // remove row (always keep at least one)
            row.querySelector(".ing-remove").addEventListener("click", () => {
                row.remove();
                if (!document.querySelector("#ingredient-rows .ingredient-row")) addIngredientRow();
                else updateFirstIngredientRequired();
            });

            document.getElementById("ingredient-rows").appendChild(row);
            updateFirstIngredientRequired();
        }

        // only the first ingredient row is required
        function updateFirstIngredientRequired() {
            document.querySelectorAll("#ingredient-rows .ing-name").forEach((input, index) => {
                input.required = index === 0;
            });
        }

        function readIngredients() {
            return [...document.querySelectorAll("#ingredient-rows .ingredient-row")]
                .map(row => ({
                    name: row.querySelector(".ing-name").value.trim(),
                    quantity: Number(row.querySelector(".ing-qty").textContent),
                    unit: row.querySelector(".ing-unit").value
                }))
                .filter(ing => ing.name !== "");
        }

        function resetIngredientRows() {
            document.getElementById("ingredient-rows").innerHTML = "";
            addIngredientRow();
        }

        function formatIngredient(ing) {
            if (typeof ing === "string") return ing;
            return [ing.quantity || "", ing.unit, ing.name].filter(Boolean).join(" ");
        }

        // Image upload preview
        document.getElementById("new-recipe-image").addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                currentRecipeImage = reader.result;
                document.getElementById("new-recipe-image-preview").src = currentRecipeImage;
            };
            reader.readAsDataURL(file);
        });

        // Opens the add-recipe popup, either blank (new recipe) or pre-filled for editing
        function openAddRecipePopup(recipe = null) {
            editingRecipeId = recipe ? recipe.id : null;
            document.getElementById("add-recipe-form-title").textContent = recipe ? "Edit Recipe" : "Add Recipe";
            document.getElementById("add-recipe-submit-btn").textContent = recipe ? "Save Changes" : "Add Recipe";

            document.getElementById("new-recipe-name").value = recipe ? recipe.name : "";
            document.getElementById("new-recipe-difficulty").value = recipe ? recipe.difficulty : "easy";
            document.getElementById("new-recipe-time").value = recipe ? recipe.time : "";
            document.getElementById("new-recipe-steps").value = recipe ? recipe.steps.join("\n") : "";

            document.getElementById("new-recipe-image").value = "";
            currentRecipeImage = recipe ? recipe.image || null : null;
            document.getElementById("new-recipe-image-preview").src = currentRecipeImage || PLACEHOLDER_IMAGE;

            document.getElementById("ingredient-rows").innerHTML = "";
            if (recipe && recipe.ingredients.length) {
                recipe.ingredients.forEach(ing => addIngredientRow(ing));
            } else {
                addIngredientRow();
            }

            openPopup("add-recipe-popup");
        }

        // Create or update a recipe
        document.getElementById("add-recipe-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("new-recipe-name").value.trim();
            if (name === "") return;

            const recipes = loadRecipes();
            const fields = {
                name: name,
                image: currentRecipeImage,
                difficulty: document.getElementById("new-recipe-difficulty").value,
                time: Number(document.getElementById("new-recipe-time").value) || 0,
                ingredients: readIngredients(),
                steps: splitLines(document.getElementById("new-recipe-steps").value)
            };

            if (editingRecipeId !== null) {
                const recipe = recipes.find(r => r.id === editingRecipeId);
                if (recipe) Object.assign(recipe, fields);
            } else {
                recipes.push(Object.assign({ id: Date.now() }, fields));
            }

            saveRecipes(recipes);
            editingRecipeId = null;
            currentRecipeImage = null;
            this.reset();
            document.getElementById("new-recipe-image-preview").src = PLACEHOLDER_IMAGE;
            resetIngredientRows();
            closePopup();
            renderRecipes();
        });

        // Rendering all the recipe cards (filtered + sorted)
        function renderRecipes() {
            const grid = document.getElementById("recipes-grid");
            grid.querySelectorAll(".recipe-card:not(#add-recipe)").forEach(card => card.remove());

            const query = document.getElementById("recipe-name").value.trim().toLowerCase();
            const sortBy = document.getElementById("sort").value;

            // filter by name
            let recipes = loadRecipes().filter(recipe =>
                recipe.name.toLowerCase().includes(query)
            );

            // sort
            if (sortBy === "difficulty") {
                recipes.sort((a, b) =>
                    DIFFICULTY_ORDER[a.difficulty] - DIFFICULTY_ORDER[b.difficulty] || a.name.localeCompare(b.name)
                );
            } else if (sortBy === "time") {
                recipes.sort((a, b) =>
                    a.time - b.time || a.name.localeCompare(b.name)
                );
            } else if (sortBy === "availability") {
                recipes.sort((a, b) =>
                    recipeAvailabilityScore(b) - recipeAvailabilityScore(a) || a.name.localeCompare(b.name)
                );
            }

            recipes.forEach(recipe => {
                const card = document.createElement("div");
                card.className = "card recipe-card";
                card.innerHTML = `
                    <img src="" alt="">
                    <h2></h2>
                    <h4 class="card-difficulty"></h4>
                    <h4 class="card-time"></h4>
                `;
                card.querySelector("img").src = recipe.image || PLACEHOLDER_IMAGE;
                card.querySelector("h2").textContent = AVAILABILITY_ICONS[recipeAvailabilityStatus(recipe)] + " " + recipe.name;
                card.querySelector(".card-difficulty").textContent = "Difficulty: " + capitalize(recipe.difficulty);
                card.querySelector(".card-time").textContent = recipe.time + " min";

                card.addEventListener("click", () => openRecipeDetails(recipe.id));
                grid.appendChild(card);
            });
        }

        // re-render whenever the search or sort changes
        document.getElementById("recipe-name").addEventListener("input", renderRecipes);
        document.getElementById("sort").addEventListener("change", renderRecipes);

        // Recipe popup
        function fillList(listId, items) {
            const list = document.getElementById(listId);
            list.innerHTML = "";
            items.forEach(text => {
                const li = document.createElement("li");
                li.textContent = text;
                list.appendChild(li);
            });
        }

        const STAR_OUTLINE = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-star" viewBox="0 0 16 16">
            <path d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.314.16-.888-.282-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.612.636-.283.95l3.523 3.356-.83 4.73zm4.905-2.767-3.686 1.894.694-3.957a.56.56 0 0 0-.163-.505L1.71 6.745l4.052-.576a.53.53 0 0 0 .393-.288L8 2.223l1.847 3.658a.53.53 0 0 0 .393.288l4.052.575-2.906 2.77a.56.56 0 0 0-.163.506l.694 3.957-3.686-1.894a.5.5 0 0 0-.461 0z"/>
        </svg>`;
        const STAR_FILLED = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-star-fill" viewBox="0 0 16 16">
            <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.465.792c.197-.39.73-.39.927 0l2.192 4.327 4.898.696c.441.062.612.636.283.95l-3.523 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187z"/>
        </svg>`;

        function renderFavoriteButton(recipe) {
            const btn = document.getElementById("favorite-btn");
            btn.innerHTML = recipe.favorited ? STAR_FILLED : STAR_OUTLINE;
            btn.classList.toggle("favorited", !!recipe.favorited);
        }

        document.getElementById("favorite-btn").addEventListener("click", function () {
            if (currentRecipeId === null) return;

            const recipes = loadRecipes();
            const recipe = recipes.find(r => r.id === currentRecipeId);
            if (!recipe) return;

            recipe.favorited = !recipe.favorited;
            saveRecipes(recipes);
            renderFavoriteButton(recipe);
        });

        function fillIngredientsList(ingredients) {
            const list = document.getElementById("detail-ingredients");
            list.innerHTML = "";
            ingredients.forEach(ing => {
                const li = document.createElement("li");
                const icon = typeof ing === "string" ? "" : AVAILABILITY_ICONS[ingredientAvailability(ing)] + " ";
                li.textContent = icon + formatIngredient(ing);
                list.appendChild(li);
            });
        }

        function openRecipeDetails(recipeId) {
            const recipe = loadRecipes().find(r => r.id === recipeId);
            if (!recipe) return;

            currentRecipeId = recipe.id;
            document.getElementById("detail-image").src = recipe.image || PLACEHOLDER_IMAGE;
            document.getElementById("detail-name").textContent = recipe.name;
            document.getElementById("detail-difficulty").textContent = "Difficulty: " + capitalize(recipe.difficulty);
            document.getElementById("detail-time").textContent = "Time: " + recipe.time + " minutes";
            renderFavoriteButton(recipe);
            fillIngredientsList(recipe.ingredients);
            fillList("detail-steps", recipe.steps);
            openPopup("recipe-details-popup");
        }

        // Shopping list stuff
        function loadShoppingReceipts() {
            let receipts = JSON.parse(localStorage.getItem("shoppingReceipts") || "null");
            if (!receipts || receipts.length === 0) {
                receipts = [{
                    id: Date.now(),
                    name: "my shopping list",
                    items: JSON.parse(localStorage.getItem("shoppingList") || "[]")
                }];
            }
            return receipts;
        }

        function saveShoppingReceipts(receipts) {
            localStorage.setItem("shoppingReceipts", JSON.stringify(receipts));
            localStorage.setItem("shoppingList", JSON.stringify(receipts.flatMap(r => r.items)));
        }

        document.getElementById("open-add-to-shopping-btn").addEventListener("click", function () {
            if (currentRecipeId === null) return;

            const select = document.getElementById("shopping-list-select");
            const receipts = loadShoppingReceipts();
            select.innerHTML = "";
            receipts.forEach(receipt => {
                const option = document.createElement("option");
                option.value = receipt.id;
                option.textContent = receipt.name;
                select.appendChild(option);
            });

            const activeReceipt = Number(localStorage.getItem("activeReceipt"));
            if (receipts.some(r => r.id === activeReceipt)) select.value = activeReceipt;

            document.querySelector('input[name="shopping-preset"][value="all"]').checked = true;
            openPopup("add-to-shopping-popup");
        });

        document.getElementById("confirm-add-to-shopping-btn").addEventListener("click", function () {
            if (currentRecipeId === null) return;

            const recipe = loadRecipes().find(r => r.id === currentRecipeId);
            if (!recipe) return;

            const preset = document.querySelector('input[name="shopping-preset"]:checked').value;
            const ingredients = recipe.ingredients.filter(ing => typeof ing !== "string");
            const selected = preset === "missing"
                ? ingredients.filter(ing => ingredientAvailability(ing) !== "green")
                : ingredients;

            if (selected.length === 0) {
                alert(preset === "missing" ? "You already have everything for this recipe!" : "This recipe has no ingredients to add.");
                return;
            }

            const receipts = loadShoppingReceipts();
            const listId = Number(document.getElementById("shopping-list-select").value);
            const receipt = receipts.find(r => r.id === listId);
            if (!receipt) return;

            selected.forEach(ing => {
                receipt.items.push({ name: ing.name, checked: false });
            });

            saveShoppingReceipts(receipts);
            closePopup();
        });

        document.getElementById("edit-recipe-btn").addEventListener("click", function () {
            if (currentRecipeId === null) return;

            const recipe = loadRecipes().find(r => r.id === currentRecipeId);
            if (!recipe) return;

            openAddRecipePopup(recipe);
        });

        document.getElementById("delete-recipe-btn").addEventListener("click", function () {
            if (currentRecipeId === null) return;

            const name = document.getElementById("detail-name").textContent;
            if (!confirm(`Delete "${name}"? This can't be undone.`)) return;

            const recipes = loadRecipes().filter(r => r.id !== currentRecipeId);
            saveRecipes(recipes);

            currentRecipeId = null;
            closePopup();
            renderRecipes();
        });

        resetIngredientRows();
        renderRecipes();
    </script>
</body>
</html>
